<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Ferramenta de Tradução — NieR Gestalt</title>
<style>
  :root{
    --bg:#14161c; --panel:#1c1f28; --panel2:#232733; --border:#333949;
    --text:#e7e9ee; --dim:#9aa1b2; --accent:#5b9dff; --accent2:#7fd88a;
    --warn:#e8b13a; --danger:#e5566d; --mono: 'Consolas','Menlo',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;}
  #dropzone{
    margin:24px; padding:40px; border:2px dashed var(--border); border-radius:12px;
    text-align:center; color:var(--dim); cursor:pointer; transition:.15s;
  }
  #dropzone.drag{border-color:var(--accent); color:var(--text); background:#1a2233;}
  #dropzone b{color:var(--text)}
  header{
    position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--border);
    padding:10px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  header h1{font-size:15px; margin:0; color:var(--dim); font-weight:600;}
  header .fname{color:var(--accent); font-weight:700; font-family:var(--mono);}
  .btn{
    background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:7px;
    padding:7px 12px; cursor:pointer; font-size:13px;
  }
  .btn:hover{border-color:var(--accent);}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:#08101f; font-weight:700;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.warn{background:var(--warn); border-color:var(--warn); color:#221900; font-weight:700;}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  input[type=text], input[type=search]{
    background:#0f1117; color:var(--text); border:1px solid var(--border); border-radius:7px;
    padding:7px 10px; font-size:13px;
  }
  #searchBox{width:230px;}
  .spacer{flex:1;}
  #stats{color:var(--dim); font-size:12px; white-space:nowrap;}
  #langTabs{display:none; gap:4px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--border);}
  #langTabs button{background:transparent;border:1px solid var(--border);color:var(--dim);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:13px;}
  #langTabs button.active{background:var(--accent); color:#08101f; border-color:var(--accent); font-weight:700;}
  #replaceBar{
    display:none; gap:8px; padding:10px 16px; background:#1a1d27; border-bottom:1px solid var(--border);
    align-items:center; flex-wrap:wrap;
  }
  #replaceBar input{width:220px;}
  #legend{padding:8px 16px; font-size:12px; color:var(--dim); background:#181a22; border-bottom:1px solid var(--border); display:none;}
  #legend code{background:#0f1117;color:var(--accent2);padding:1px 5px;border-radius:4px;}
  main{padding:16px; max-width:1180px; margin:0 auto;}
  .entry{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:12px 14px; margin-bottom:10px;
  }
  .entry.done{opacity:.55;}
  .entry.anomaly{border-color:var(--danger); background:#241820;}
  .entry-head{display:flex; align-items:center; gap:8px; margin-bottom:6px; flex-wrap:wrap;}
  .idtag{font-family:var(--mono); font-size:11px; color:var(--dim); background:#0f1117; padding:2px 7px; border-radius:5px;}
  .grouptag{font-family:var(--mono); font-size:10px; color:#6b7280;}
  .kindtag{font-size:10px; padding:2px 6px; border-radius:5px; background:#2a3040; color:var(--dim);}
  .kindtag.multilang{background:#213a2b; color:var(--accent2);}
  .kindtag.anomaly{background:#3a2130; color:var(--danger);}
  .doneToggle{margin-left:auto; display:flex; align-items:center; gap:5px; font-size:11px; color:var(--dim); cursor:pointer;}
  .ref{
    font-size:12.5px; color:var(--dim); background:#171a22; border-left:3px solid #3a4152;
    padding:5px 8px; margin-bottom:5px; border-radius:4px; white-space:pre-wrap; font-family:var(--mono);
  }
  .ref b{color:#7f8798; font-weight:600; margin-right:6px;}
  textarea.edit{
    width:100%; background:#0f1117; color:var(--text); border:1px solid var(--border); border-radius:6px;
    padding:8px; font-size:13.5px; font-family:var(--mono); resize:vertical; min-height:38px; line-height:1.45;
  }
  textarea.edit:focus{outline:none; border-color:var(--accent);}
  textarea.edit.bad{border-color:var(--danger);}
  .fieldlabel{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.04em; margin:6px 0 2px;}
  .codes{margin-top:4px; display:flex; gap:5px; flex-wrap:wrap;}
  .codechip{font-family:var(--mono); font-size:10.5px; background:#1c2b3a; color:#7fc3ff; padding:1px 6px; border-radius:10px; border:1px solid #274257;}
  .warnline{color:var(--danger); font-size:11.5px; margin-top:3px;}
  .meta{margin-top:6px;}
  .meta summary{cursor:pointer; font-size:11px; color:var(--dim);}
  .metafields{display:flex; flex-wrap:wrap; gap:4px; margin-top:5px;}
  .metafields span{font-family:var(--mono); font-size:10.5px; background:#0f1117; color:#8890a0; padding:2px 6px; border-radius:4px; border:1px solid var(--border);}
  .fixbtn{font-size:11px; margin-top:6px;}
  #loadMore{display:block; margin:18px auto; }
  #emptyMsg{text-align:center;color:var(--dim);padding:40px;}
  .hint{font-size:11px;color:var(--dim);margin-top:4px;}
  .toast{
    position:fixed; bottom:18px; left:50%; transform:translateX(-50%); background:#0f1117; color:var(--text);
    border:1px solid var(--accent); padding:10px 18px; border-radius:8px; font-size:13px; z-index:99; display:none;
  }
</style>
</head>
<body>

<select id="uiLang" class="btn" style="position:fixed;top:8px;right:10px;z-index:50;padding:4px 8px" title="Language / Idioma">
  <option value="pt">Português</option>
  <option value="en">English</option>
  <option value="es">Español</option>
</select>

<div id="serverBar" style="display:none;margin:44px 24px 0;padding:14px;background:var(--panel);border:1px solid var(--border);border-radius:12px;gap:8px;align-items:center;flex-wrap:wrap">
  <b data-i18n="project">Projeto:</b>
  <select id="srvLang" class="btn"></select>
  <select id="srvFile" class="btn" style="max-width:420px"></select>
  <button class="btn primary" id="srvOpen" data-i18n="openFile">Abrir arquivo</button>
  <button class="btn" id="srvNew" data-i18n="newLang">Criar novo idioma…</button>
  <button class="btn" id="srvFolder" data-i18n="openFolder">Abrir pasta TEXT</button>
  <span id="srvMsg" style="font-size:12px;color:var(--dim)"></span>
</div>

<div id="dropzone">
  <div style="font-size:15px;" data-i18n-html="drop1">📂 Arraste um arquivo aqui</div>
  <div style="font-size:12px;margin-top:8px;" data-i18n="drop2"></div>
  <input type="file" id="fileInput" style="display:none">
</div>

<header id="topbar" style="display:none">
  <h1 data-i18n="editor">Editor:</h1>
  <span class="fname" id="fname">—</span>
  <button class="btn" id="btnOpenAnother" data-i18n="openAnother">Abrir outro arquivo</button>
  <input type="search" id="searchBox" data-i18n-ph="search">
  <button class="btn" id="btnReplaceToggle" data-i18n="replaceAll">Buscar &amp; Substituir tudo</button>
  <button class="btn" id="btnLegendToggle" data-i18n="codes">Códigos detectados</button>
  <label class="btn" style="display:flex;align-items:center;gap:6px;">
    <input type="checkbox" id="onlyPending"> <span data-i18n="onlyPending">só pendências</span>
  </label>
  <span class="spacer"></span>
  <span id="stats"></span>
  <button class="btn primary" id="btnExport" data-i18n="save">⬇ Salvar arquivo traduzido</button>
</header>

<div id="langTabs"></div>

<div id="replaceBar">
  <input type="text" id="findInput" data-i18n-ph="findPh">
  <input type="text" id="replInput" data-i18n-ph="replPh">
  <label style="font-size:12px;color:var(--dim);display:flex;align-items:center;gap:5px;">
    <input type="checkbox" id="caseSensitive" checked> <span data-i18n="caseSens">diferenciar maiúsc/minúsc</span>
  </label>
  <button class="btn warn" id="btnDoReplace" data-i18n="doReplace">Substituir tudo</button>
  <span id="replResult" style="font-size:12px;color:var(--dim);"></span>
</div>

<div id="legend"></div>

<main>
  <div id="entriesRoot"></div>
  <div id="emptyMsg" style="display:none" data-i18n="empty"></div>
  <button class="btn" id="loadMore" style="display:none" data-i18n="loadMore"></button>
</main>

<div class="toast" id="toast"></div>

let UI = 'pt';
try { UI = localStorage.getItem('niertool_ui') || ''; } catch (e) {}
if (!I18N[UI]) { const n = (navigator.language || 'pt').slice(0, 2); UI = I18N[n] ? n : 'en'; }
function T(k, ...a) {
  let s = (I18N[UI][k] ?? I18N.pt[k] ?? k);
  a.forEach((v, i) => { s = s.split('{' + i + '}').join(v); });
  return s;
}
function applyUI() {
  document.documentElement.lang = UI === 'pt' ? 'pt-BR' : UI;
  document.title = T('title');
  document.querySelectorAll('[data-i18n]').forEach(n => n.textContent = T(n.dataset.i18n));
  document.querySelectorAll('[data-i18n-html]').forEach(n => n.innerHTML = T(n.dataset.i18nHtml));
  document.querySelectorAll('[data-i18n-ph]').forEach(n => n.placeholder = T(n.dataset.i18nPh));
  document.getElementById('uiLang').value = UI;
  if (typeof state !== 'undefined' && state.entries && state.entries.length) { buildLangTabs(); render(); }
}

const CODE_RE = /<[^<>\r\n]{1,60}>|%[a-zA-Z%]|#[?!]/g;

let state = {
  fileName: null,
  mode: null,        // 'generic' | 'txd'
  endsWithSep: true,
  entries: [],        // unified entry objects, see below
  langTab: 'pt',       // for multilang view: jp/pt/fr/de
  page: 150,
  filterText: '',
  onlyPending: false,
};

/* ---------------- Entry shapes ----------------
  generic-single:  {kind:'single', id, groupId, fields:[...], editIdx:[...], labels:[...]}
  generic-blank:   {kind:'blank'}
  generic-anomaly: {kind:'anomaly-g', raw, expected}
  multilang:       {kind:'multilang', id, groupId, jp, pt, fr, de, __src:{...reconstruction data...}}
  txd-anomaly:     {kind:'anomaly-txd', id, rawLines}
------------------------------------------------- */

// ================= PARSERS =================

function parseGeneric(raw) {
  const endsSep = raw.endsWith('\r\n');
  let rows = raw.split('\r\n');
  if (endsSep) rows = rows.slice(0, -1);

  const counts = {};
  for (const r of rows) {
    if (r === '') continue;
    const c = (r.match(/\t/g) || []).length;
    counts[c] = (counts[c] || 0) + 1;
  }
  let mode = 0, best = -1;
  for (const k in counts) if (counts[k] > best) { best = counts[k]; mode = +k; }
  const expected = mode + 1;

  // Decide profile
  const isMultiLang = (expected === 5);

  // heuristic: secondary editable title field (for INW-like files: second to last field carries a short label)
  let secondaryIdx = -1;
  if (!isMultiLang && expected >= 3) {
    let withLetter = 0, total = 0;
    for (const r of rows) {
      if (r === '') continue;
      const f = r.split('\t');
      if (f.length !== expected) continue;
      const last = f[expected - 1], prev = f[expected - 2];
      if (last.trim() === '') continue;
      total++;
      if (/[A-Za-zÀ-ÖØ-öø-ÿ]/.test(prev)) withLetter++;
    }
    if (total > 0 && withLetter / total > 0.15) secondaryIdx = expected - 2;
  }

  const entries = [];
  let groupId = '';
  for (const r of rows) {
    if (r === '') { entries.push({ kind: 'blank' }); continue; }
    const fields = r.split('\t');
    if (fields.length !== expected) {
      entries.push({ kind: 'anomaly-g', raw: r, expected });
      continue;
    }
    if (fields[0] !== '') groupId = fields[0];
    if (isMultiLang) {
      entries.push({
        kind: 'multilang', id: fields[0], groupId,
        jp: fields[1], pt: fields[2], fr: fields[3], de: fields[4],
        _orig: { jp: fields[1], pt: fields[2], fr: fields[3], de: fields[4] },
        _single: true
      });
    } else {
      const editIdx = secondaryIdx >= 0 ? [secondaryIdx, expected - 1] : [expected - 1];
      entries.push({
        kind: 'single', id: fields[0], groupId,
        fields, orig: fields.slice(), editIdx
      });
    }
  }
  return { rowSep: '\r\n', endsSep, entries, expected, isMultiLang };
}

function serializeGeneric() {
  const lines = state.entries.map(e => {
    if (e.kind === 'blank') return '';
    if (e.kind === 'anomaly-g') return e.raw;
    if (e.kind === 'multilang') return [e.id, e.jp, e.pt, e.fr, e.de].join('\t');
    if (e.kind === 'single') return e.fields.join('\t');
    return '';
  });
  return lines.join('\r\n') + (state.endsWithSep ? '\r\n' : '');
}

// ---- TXD (LF-based, multi-line multilang) ----
function groupTXDLines(raw) {
  const endsNL = raw.endsWith('\n');
  let lines = raw.split('\n');
  if (endsNL) lines = lines.slice(0, -1);
  const idpat = /^[0-9]+$/;
  const groups = [];
  let cur = null;
  for (const ln of lines) {
    const ft = ln.indexOf('\t');
    const first = ft === -1 ? ln : ln.slice(0, ft);
    if (idpat.test(first)) {
      if (cur) groups.push(cur);
      cur = { id: first, rawLines: [ln] };
    } else {
      if (cur === null) cur = { id: null, rawLines: [ln] };
      else cur.rawLines.push(ln);
    }
  }
  if (cur) groups.push(cur);
  return { endsNL, groups };
}

function buildVirtual(lines) {
  let V = '', L = [];
  for (let i = 0; i < lines.length; i++) {
    if (i > 0 && !lines[i].startsWith('\t')) { V += '\n'; L.push(i); }
    for (const ch of lines[i]) { V += ch; L.push(i); }
  }
  return { V, L };
}

function parseTXDEntry(rawLines) {
  let lines = rawLines.slice();
  let trailingBlanks = 0;
  while (lines.length > 1 && lines[lines.length - 1] === '') { lines.pop(); trailingBlanks++; }
  const { V, L } = buildVirtual(lines);
  const parts = V.split('\t');
  if (parts.length !== 5) return null;
  const firstLine = [], lastLine = [];
  let pos = 0;
  for (const p of parts) {
    if (p.length === 0) {
      const g = L[Math.min(pos, L.length - 1)] ?? 0;
      firstLine.push(g); lastLine.push(g);
    } else {
      firstLine.push(L[pos]); lastLine.push(L[pos + p.length - 1]);
    }
    pos += p.length + 1;
  }
  const chain = [];
  for (let k = 0; k < 4; k++) chain.push(lastLine[k] === firstLine[k + 1]);
  return { values: parts, chain, trailingBlanks };
}

function reconstructTXDEntry(values, chain, trailingBlanks) {
  const colFrags = values.map(v => v.split('\n'));
  const lines = [];
  let curLine = colFrags[0][0];
  for (let k = 0; k < 4; k++) {
    const frags = colFrags[k + 1];
    if (chain[k]) curLine += '\t' + frags[0];
    else { lines.push(curLine); curLine = '\t' + frags[0]; }
    for (let f = 1; f < frags.length; f++) { lines.push(curLine); curLine = frags[f]; }
  }
  lines.push(curLine);
  for (let b = 0; b < trailingBlanks; b++) lines.push('');
  return lines;
}

function parseTXD(raw) {
  const { endsNL, groups } = groupTXDLines(raw);
  const entries = [];
  for (const g of groups) {
    const p = parseTXDEntry(g.rawLines);
    if (!p) {
      entries.push({ kind: 'anomaly-txd', id: g.id || '(?)', rawLines: g.rawLines, rawText: g.rawLines.join('\n') });
      continue;
    }
    entries.push({
      kind: 'multilang', id: g.id, groupId: g.id,
      jp: p.values[1], pt: p.values[2], fr: p.values[3], de: p.values[4],
      _orig: { jp: p.values[1], pt: p.values[2], fr: p.values[3], de: p.values[4] },
      _chain: p.chain, _trailingBlanks: p.trailingBlanks
    });
  }
  return { endsNL, entries };
}

function serializeTXD() {
  const allLines = [];
  for (const e of state.entries) {
    if (e.kind === 'anomaly-txd') {
      allLines.push(...e.rawText.split('\n'));
    } else {
      const values = [e.id, e.jp, e.pt, e.fr, e.de];
      allLines.push(...reconstructTXDEntry(values, e._chain, e._trailingBlanks));
    }
  }
  return allLines.join('\n') + (state.endsWithSep ? '\n' : '');
}

// ================= LOAD =================

function humanSize(n) { return n > 1e6 ? (n / 1e6).toFixed(2) + ' MB' : (n / 1e3).toFixed(1) + ' KB'; }

function handleFile(file) {
  const reader = new FileReader();
  reader.onload = () => { state.server = null; loadRaw(reader.result, file.name); };
  reader.readAsText(file, 'UTF-8');
}

function loadRaw(raw, name) {
  {
    const file = { name };
    state.fileName = file.name;
    state.entries = [];
    state.page = 150;
    state.filterText = '';
    document.getElementById('searchBox').value = '';
    state.onlyPending = false;
    document.getElementById('onlyPending').checked = false;

    const hasCRLF = raw.includes('\r\n');
    if (hasCRLF) {
      const p = parseGeneric(raw);
      state.mode = 'generic';
      state.endsWithSep = p.endsSep;
      state.entries = p.entries;
      state.isMultiLang = p.isMultiLang;
    } else {
      const p = parseTXD(raw);
      state.mode = 'txd';
      state.endsWithSep = p.endsNL;
      state.entries = p.entries;
      state.isMultiLang = true;
    }

    document.getElementById('fname').textContent = file.name + '  (' + humanSize(raw.length) + ')';
    document.getElementById('dropzone').style.display = 'none';
    document.getElementById('topbar').style.display = 'flex';
    document.getElementById('langTabs').style.display = state.isMultiLang ? 'flex' : 'none';
    buildLangTabs();
    render();
  }
}

function buildLangTabs() {
  const el = document.getElementById('langTabs');
  if (!state.isMultiLang) { el.innerHTML = ''; return; }
  const tabs = [
    ['jp', T('tabJp')],
    ['pt', T('tabTr')],
    ['fr', T('tabFr')],
    ['de', T('tabDe')]
  ];
  el.innerHTML = tabs.map(([k, label]) =>
    `<button data-lang="${k}" class="${state.langTab === k ? 'active' : ''}">${label}</button>`
  ).join('');
  el.querySelectorAll('button').forEach(b => {
    b.onclick = () => { state.langTab = b.dataset.lang; buildLangTabs(); render(); };
  });
}

// ================= PROGRESS (localStorage) =================
function progressKey(fileName, id, idx) { return 'niertool_done::' + fileName + '::' + (id || ('#' + idx)); }
function isDone(entry, idx) {
  const id = entry.id || entry.groupId;
  return localStorage.getItem(progressKey(state.fileName, id, idx)) === '1';
}
function setDone(entry, idx, val) {
  const id = entry.id || entry.groupId;
  const key = progressKey(state.fileName, id, idx);
  if (val) localStorage.setItem(key, '1'); else localStorage.removeItem(key);
}

// ================= CODE VALIDATION =================
function extractCodes(text) { return (text.match(CODE_RE) || []); }
function codesDiffHtml(origText, curText) {
  const orig = extractCodes(origText), cur = extractCodes(curText);
  const origCount = {}, curCount = {};
  orig.forEach(c => origCount[c] = (origCount[c] || 0) + 1);
  cur.forEach(c => curCount[c] = (curCount[c] || 0) + 1);
  const missing = [], extra = [];
  for (const c in origCount) if ((curCount[c] || 0) < origCount[c]) missing.push(c);
  for (const c in curCount) if ((origCount[c] || 0) < curCount[c]) extra.push(c);
  return { missing, extra, orig };
}

// ================= RENDER =================

function matchesFilter(entry) {
  if (!state.filterText) return true;
  const q = state.filterText.toLowerCase();
  const hay = [];
  if (entry.kind === 'multilang') hay.push(entry.id, entry.pt, entry.jp, entry.fr, entry.de);
  else if (entry.kind === 'single') hay.push(entry.id, ...entry.editIdx.map(i => entry.fields[i]));
  else if (entry.kind === 'anomaly-g') hay.push(entry.raw);
  else if (entry.kind === 'anomaly-txd') hay.push(entry.id, entry.rawText);
  return hay.some(h => h && h.toLowerCase().includes(q));
}

function render() {
  const root = document.getElementById('entriesRoot');
  root.innerHTML = '';
  let visible = state.entries
    .map((e, idx) => ({ e, idx }))
    .filter(({ e }) => e.kind !== 'blank')
    .filter(({ e }) => matchesFilter(e))
    .filter(({ e, idx }) => !state.onlyPending || !isDone(e, idx) || e.kind.startsWith('anomaly'));

  document.getElementById('emptyMsg').style.display = visible.length === 0 ? 'block' : 'none';

  const shown = visible.slice(0, state.page);
  const frag = document.createDocumentFragment();
  shown.forEach(({ e, idx }) => frag.appendChild(renderEntry(e, idx)));
  root.appendChild(frag);

  const loadMoreBtn = document.getElementById('loadMore');
  loadMoreBtn.style.display = visible.length > state.page ? 'block' : 'none';

  const totalReal = state.entries.filter(e => e.kind !== 'blank').length;
  const anomalies = state.entries.filter(e => e.kind.startsWith('anomaly')).length;
  const doneCount = state.entries.filter((e, i) => e.kind !== 'blank' && isDone(e, i)).length;
  document.getElementById('stats').textContent =
    T('stats', totalReal, doneCount, anomalies) +
    (state.filterText ? T('statsFilter', visible.length) : '');
}

function el(tag, cls, html) { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; }

function renderEntry(entry, idx) {
  if (entry.kind === 'anomaly-g') return renderAnomalyGeneric(entry, idx);
  if (entry.kind === 'anomaly-txd') return renderAnomalyTXD(entry, idx);
  if (entry.kind === 'multilang') return renderMultilang(entry, idx);
  if (entry.kind === 'single') return renderSingle(entry, idx);
  return el('div');
}

function head(entry, idx, kindLabel, kindCls) {
  const h = el('div', 'entry-head');
  h.appendChild(el('span', 'idtag', 'ID ' + (entry.id || '—')));
  if (entry.groupId && entry.groupId !== entry.id) h.appendChild(el('span', 'grouptag', T('group', entry.groupId)));
  h.appendChild(el('span', 'kindtag ' + (kindCls || ''), kindLabel));
  const doneLbl = el('label', 'doneToggle');
  const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = isDone(entry, idx);
  cb.onchange = () => { setDone(entry, idx, cb.checked); box.classList.toggle('done', cb.checked); };
  doneLbl.appendChild(cb); doneLbl.appendChild(document.createTextNode(T('done')));
  h.appendChild(doneLbl);
  var box; // set by caller
  h._setBox = (b) => { box = b; };
  return h;
}

function codesRow(text) {
  const codes = extractCodes(text);
  if (!codes.length) return null;
  const wrap = el('div', 'codes');
  [...new Set(codes)].forEach(c => wrap.appendChild(el('span', 'codechip', esc(c))));
  return wrap;
}

function esc(s) { return (s + '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c])); }

function warnFor(ta, origText) {
  const w = el('div', 'warnline'); w.style.display = 'none';
  function update() {
    const { missing, extra } = codesDiffHtml(origText, ta.value);
    if (missing.length || extra.length) {
      let msg = '';
      if (missing.length) msg += T('missing') + missing.join(', ') + '  ';
      if (extra.length) msg += T('extra') + extra.join(', ');
      w.textContent = msg; w.style.display = 'block'; ta.classList.add('bad');
    } else { w.style.display = 'none'; ta.classList.remove('bad'); }
  }
  ta.addEventListener('input', update);
  update();
  return w;
}

function renderMultilang(entry, idx) {
  const box = el('div', 'entry' + (isDone(entry, idx) ? ' done' : ''));
  const h = head(entry, idx, T('multiKind'), 'multilang');
  h._setBox(box);
  box.appendChild(h);

  if (state.langTab === 'jp') {
    box.appendChild(el('div', 'ref', '<b>JP</b>' + esc(entry.jp)));
  } else if (state.langTab === 'fr' || state.langTab === 'de') {
    const key = state.langTab, label = key === 'fr' ? 'FR' : 'DE';
    box.appendChild(el('div', 'ref', '<b>JP</b>' + esc(entry.jp)));
    const ta = document.createElement('textarea');
    ta.className = 'edit'; ta.value = entry[key]; ta.rows = Math.max(1, entry[key].split('\n').length);
    ta.addEventListener('input', () => { entry[key] = ta.value; });
    box.appendChild(el('div', 'fieldlabel', T('refEditable', label)));
    box.appendChild(ta);
    box.appendChild(warnFor(ta, entry._orig[key]));
  } else {
    // pt (default / primary)
    box.appendChild(el('div', 'ref', '<b>JP</b>' + esc(entry.jp)));
    const ta = document.createElement('textarea');
    ta.className = 'edit'; ta.value = entry.pt; ta.rows = Math.max(1, entry.pt.split('\n').length);
    ta.addEventListener('input', () => { entry.pt = ta.value; });
    box.appendChild(el('div', 'fieldlabel', T('fieldTrans')));
    box.appendChild(ta);
    const cRow = codesRow(entry._orig.pt); if (cRow) box.appendChild(cRow);
    box.appendChild(warnFor(ta, entry._orig.pt));

    const details = document.createElement('details'); details.className = 'meta';
    const sum = document.createElement('summary'); sum.textContent = T('refFrDe');
    details.appendChild(sum);
    const mf = el('div', 'metafields');
    mf.appendChild(el('span', null, 'FR: ' + esc(entry.fr.slice(0, 160))));
    mf.appendChild(el('span', null, 'DE: ' + esc(entry.de.slice(0, 160))));
    details.appendChild(mf);
    box.appendChild(details);
  }
  return box;
}

function renderSingle(entry, idx) {
  const box = el('div', 'entry' + (isDone(entry, idx) ? ' done' : ''));
  const h = head(entry, idx, T('textKind'), '');
  h._setBox(box);
  box.appendChild(h);

  entry.editIdx.forEach((fi, n) => {
    const label = entry.editIdx.length > 1 ? (n === 0 ? T('lblTitle') : T('lblText')) : T('lblText');
    box.appendChild(el('div', 'fieldlabel', label));
    const ta = document.createElement('textarea');
    ta.className = 'edit'; ta.value = entry.fields[fi];
    ta.rows = Math.max(1, entry.fields[fi].split('\n').length);
    ta.addEventListener('input', () => { entry.fields[fi] = ta.value; });
    box.appendChild(ta);
    const cRow = codesRow(entry.orig[fi]); if (cRow) box.appendChild(cRow);
    box.appendChild(warnFor(ta, entry.orig[fi]));
  });

  // read-only metadata (codes/flags/ids) collapsed
  const otherIdx = entry.fields.map((_, i) => i).filter(i => !entry.editIdx.includes(i) && i !== 0);
  if (otherIdx.length) {
    const details = document.createElement('details'); details.className = 'meta';
    const sum = document.createElement('summary'); sum.textContent = T('techFields', otherIdx.length);
    details.appendChild(sum);
    const mf = el('div', 'metafields');
    otherIdx.forEach(i => { if (entry.fields[i] !== '') mf.appendChild(el('span', null, esc(entry.fields[i]))); });
    details.appendChild(mf);
    box.appendChild(details);
  }
  return box;
}

function renderAnomalyGeneric(entry, idx) {
  const box = el('div', 'entry anomaly');
  const h = el('div', 'entry-head');
  h.appendChild(el('span', 'idtag', T('anomLine')));
  h.appendChild(el('span', 'kindtag anomaly', T('anomExpected', entry.expected, entry.raw.split('\t').length)));
  box.appendChild(h);
  box.appendChild(el('div', 'hint',
    T('anomHint')));
  const mergeBtn = el('button', 'btn warn fixbtn', T('anomMerge'));
  mergeBtn.onclick = () => mergeAnomalyGeneric(idx);
  box.appendChild(mergeBtn);
  box.appendChild(el('div', 'fieldlabel', T('anomRaw')));
  const ta = document.createElement('textarea');
  ta.className = 'edit'; ta.value = entry.raw; ta.rows = 2;
  ta.addEventListener('input', () => { entry.raw = ta.value; });
  box.appendChild(ta);
  return box;
}

function mergeAnomalyGeneric(idx) {
  // find previous non-blank entry with editable text
  let p = idx - 1;
  while (p >= 0 && state.entries[p].kind === 'blank') p--;
  if (p < 0) { toast(T('noPrev')); return; }
  const prev = state.entries[p];
  const cur = state.entries[idx];
  if (prev.kind === 'single') {
    const fi = prev.editIdx[prev.editIdx.length - 1];
    prev.fields[fi] = prev.fields[fi] + '\n' + cur.raw;
  } else if (prev.kind === 'multilang') {
    prev.pt = prev.pt + '\n' + cur.raw;
  } else {
    toast(T('prevAnom')); return;
  }
  state.entries.splice(idx, 1);
  toast(T('merged'));
  render();
}

function renderAnomalyTXD(entry, idx) {
  const box = el('div', 'entry anomaly');
  const h = el('div', 'entry-head');
  h.appendChild(el('span', 'idtag', 'ID ' + (entry.id || '—')));
  h.appendChild(el('span', 'kindtag anomaly', T('txdKind')));
  box.appendChild(h);
  box.appendChild(el('div', 'hint',
    T('txdHint')));
  const ta = document.createElement('textarea');
  ta.className = 'edit'; ta.value = entry.rawText; ta.rows = Math.max(3, entry.rawLines.length + 1);
  ta.addEventListener('input', () => { entry.rawText = ta.value; });
  box.appendChild(ta);
  return box;
}

document.getElementById('searchBox').addEventListener('input', (e) => {
  state.filterText = e.target.value.trim();
  state.page = 150;
  render();
});
document.getElementById('onlyPending').addEventListener('change', (e) => {
  state.onlyPending = e.target.checked; render();
});
document.getElementById('loadMore').addEventListener('click', () => { state.page += 150; render(); });

document.getElementById('btnReplaceToggle').addEventListener('click', () => {
  const bar = document.getElementById('replaceBar');
  bar.style.display = bar.style.display === 'flex' ? 'none' : 'flex';
});

document.getElementById('btnDoReplace').addEventListener('click', () => {
  const find = document.getElementById('findInput').value;
  const repl = document.getElementById('replInput').value;
  const cs = document.getElementById('caseSensitive').checked;
  if (!find) { toast(T('typeFind')); return; }
  let count = 0;
  const doRepl = (text) => {
    if (text == null) return text;
    let re = new RegExp(find.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), cs ? 'g' : 'gi');
    const matches = text.match(re);
    if (matches) count += matches.length;
    return text.replace(re, repl);
  };
  state.entries.forEach(e => {
    if (e.kind === 'multilang') { e.pt = doRepl(e.pt); e.fr = doRepl(e.fr); e.de = doRepl(e.de); }
    else if (e.kind === 'single') { e.editIdx.forEach(i => { e.fields[i] = doRepl(e.fields[i]); }); }
    else if (e.kind === 'anomaly-g') { e.raw = doRepl(e.raw); }
    else if (e.kind === 'anomaly-txd') { e.rawText = doRepl(e.rawText); }
  });
  document.getElementById('replResult').textContent = T('replCount', count);
  render();
});

document.getElementById('btnLegendToggle').addEventListener('click', () => {
  const box = document.getElementById('legend');
  if (box.style.display === 'block') { box.style.display = 'none'; return; }
  const counts = {};
  const collectFrom = (t) => { extractCodes(t || '').forEach(c => counts[c] = (counts[c] || 0) + 1); };
  state.entries.forEach(e => {
    if (e.kind === 'multilang') { collectFrom(e._orig ? e._orig.pt : e.pt); }
    else if (e.kind === 'single') e.editIdx.forEach(i => collectFrom(e.orig[i]));
  });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  box.innerHTML = '<b>' + T('legendHead') + '</b><br>' +
    sorted.slice(0, 120).map(([c, n]) => `<code>${esc(c)}</code> ×${n}`).join(' &nbsp; ') +
    (sorted.length === 0 ? T('legendNone') : '');
  box.style.display = 'block';
});

document.getElementById('btnExport').addEventListener('click', () => {
  let out;
  if (state.mode === 'generic') out = serializeGeneric();
  else out = serializeTXD();
  if (state.server) {
    api('/api/save?lang=' + encodeURIComponent(state.server.lang) + '&path=' + encodeURIComponent(state.server.path),
        { method: 'POST', body: new Blob([out], { type: 'text/plain;charset=utf-8' }) })
      .then(r => toast(r.ok ? T('saved', state.server.lang + '/' + state.server.path) : T('saveErr')));
    return;
  }
  const blob = new Blob([out], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = state.fileName;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(T('exported', state.fileName));
});

// ================= SERVIDOR LOCAL (NierTradutor.exe) =================
const TOKEN = '__TOKEN__';
function api(p, opt) {
  opt = opt || {}; opt.headers = Object.assign({ 'X-Token': TOKEN }, opt.headers || {});
  return fetch(p, opt);
}
if (!TOKEN.startsWith('__')) {
  const bar = document.getElementById('serverBar');
  bar.style.display = 'flex';
  document.getElementById('dropzone').style.margin = '12px 24px';
  setInterval(() => api('/api/ping').catch(() => {}), 5000);
  const selL = document.getElementById('srvLang'), selF = document.getElementById('srvFile'), msg = document.getElementById('srvMsg');
  const lines = t => t.split('\n').filter(x => x);
  async function loadLangs(pick) {
    const langs = lines(await (await api('/api/langs')).text());
    selL.innerHTML = langs.map(l => `<option>${esc(l)}</option>`).join('');
    const want = pick || (langs.includes('Portugues') ? 'Portugues' : langs.find(l => l !== 'EXAMPLE') || langs[0]);
    if (want) selL.value = want;
    msg.textContent = langs.length ? '' : T('noLangs');
    await loadFiles();
  }
  async function loadFiles() {
    if (!selL.value) { selF.innerHTML = ''; return; }
    const files = lines(await (await api('/api/files?lang=' + encodeURIComponent(selL.value))).text());
    selF.innerHTML = files.map(f => `<option>${esc(f)}</option>`).join('');
  }
  selL.onchange = loadFiles;
  document.getElementById('srvOpen').onclick = async () => {
    if (!selL.value || !selF.value) return;
    const r = await api('/api/file?lang=' + encodeURIComponent(selL.value) + '&path=' + encodeURIComponent(selF.value));
    if (!r.ok) { toast(T('noOpen')); return; }
    state.server = { lang: selL.value, path: selF.value };
    loadRaw(await r.text(), selL.value + '/' + selF.value);
  };
  document.getElementById('srvNew').onclick = async () => {
    const name = prompt(T('newPrompt'));
    if (!name) return;
    const r = await api('/api/newlang?name=' + encodeURIComponent(name.trim()) + '&from=EXAMPLE', { method: 'POST' });
    toast(r.ok ? T('created', name) : T('createFail', await r.text()));
    if (r.ok) loadLangs(name.trim());
  };
  document.getElementById('srvFolder').onclick = () => api('/api/openfolder');
  loadLangs();
  const oldOpen = document.getElementById('btnOpenAnother').onclick;
  document.getElementById('btnOpenAnother').addEventListener('click', () => { document.getElementById('dropzone').style.display = 'block'; });
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast._h);
  toast._h = setTimeout(() => t.style.display = 'none', 3000);
}
</script>
</body>
